[project]
name = "meet-mind"
version = "0.1.0"
description = "AI-powered meeting intelligence and action-item extraction."
readme = "README.md"
authors = [
    { name = "Luis Alain", email = "luisalain230904@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.115",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "strands-agents>=1.61.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
meet-mind = "meet_mind.main:run"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "strands-agents-evals>=1.7.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies as ``param = Depends(...)`` defaults; that is its documented idiom.
"src/meet_mind/api/routes.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``evals`` lives at the repository root, next to ``tests``, rather than inside the package.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not bedrock and not decider'"
markers = [
    "bedrock: requires AWS credentials and a Bedrock model",
    "decider: requires a running local Strands Decider server",
]
